function init(si){pvOff();const s=SL[si],bl=RND()<.5?'kaze':'inz';G={p:[newP(s.cards,s.lid,0),newP(preset(bl),bl,1)],turn:0,field:null,ph:0,first:0,slot:si};G.p[ME].sv=s.sv;G.p[ME].mt=s.mat;G.p[1-ME].sv='sl0';G.p[1-ME].mt='mt0';log=[];mul=new Set();sel=null;busy=false;lock=false;draw(G.p[ME],LD[s.lid].hd);draw(G.p[1-ME],LD[bl].hd);show('app');$('#ov').style.display='none';render();ctrM();rpsUI()}

/* ---------- PvP (PeerJS) : ทั้งสองเครื่องรันเอนจินเดียวกัน (seed เดียวกัน) แล้วส่งเฉพาะ "การกระทำ/คำตอบ" ---------- */
const RT=(f,enc,dec)=>(...a)=>{if(!PVP)return f(...a);if(PQ==ME)return f(...a).then(r=>{net({t:'ans',v:enc(r)});return r});return waitAns().then(dec)};
const idl=x=>x,unitBy=id=>[...all(G.p[0]),...all(G.p[1])].find(u=>u.id==id);
const target=RT(target0,u=>u&&u.id,unitBy),handPick=RT(handPick0,idl,idl),pickN=RT(pickN0,idl,idl),ask=RT(ask0,idl,idl),askMulti=RT(askMulti0,x=>[...x],x=>new Set(x)),skillPick=RT(skillPick0,idl,idl),pickCounter=RT(pickCounter0,idl,idl);
function pvOff(){PVP=0;ME=0;RNGF=null;BOT[1]=true;SS=[null,null];AQ=[];AW=null;try{CONN&&CONN.close()}catch(e){}try{PEER&&PEER.destroy()}catch(e){}CONN=PEER=null}
const pvS=t=>{const e=$('#pvs');if(e)e.textContent=t};
function pvLost(){if(PVP&&G&&!G.over){alert('คู่ต่อสู้หลุดการเชื่อมต่อ');G.over=1;pvOff();menuR()}else pvS('การเชื่อมต่อถูกปิด')}
function lobby(){const o=SL.map((x,i)=>`<option value=${i}>Deck ${i+1} · ${T[LD[x.lid].b].n} · ${x.cards.length}/25</option>`).join('');
$('#mm').innerHTML=`<b>สู้กับผู้เล่นจริง (PeerJS)</b><div class=bar style="justify-content:center;margin:8px 0">Deck: <select id=pvd>${o}</select></div><div class=bar style="justify-content:center"><button onclick="pvHost()">🏠 สร้างห้อง</button><input id=pvc placeholder="รหัสห้อง" size=7 maxlength=5 style="text-transform:uppercase"><button class=s onclick="pvJoin()">เข้าห้อง</button></div><div id=pvs style="margin-top:8px;min-height:20px;color:var(--gd)"></div>`}
function pvDeck(){const x=SL[+$('#pvd').value];if(!RW.ld[x.lid]){alert('ลีดเดอร์ของ Deck นี้ยังไม่ปลดล็อก');return null}if(x.cards.length!=25){alert('Deck ต้องมี 25 ใบพอดี');return null}return{cards:[...x.cards],lid:x.lid,mat:x.mat,sv:x.sv}}
function pvHost(){const d=pvDeck();if(!d)return;pvOff();HD=d;const code=Math.random().toString(36).slice(2,7).toUpperCase();
PEER=new Peer('kakrn-'+code);PEER.on('open',()=>pvS('รหัสห้อง: '+code+' — ส่งให้เพื่อน แล้วรอเพื่อนเข้าห้อง'));
PEER.on('error',e=>pvS(e.type=='unavailable-id'?'รหัสซ้ำ กดสร้างห้องใหม่':'ผิดพลาด: '+e.type));
PEER.on('connection',c=>{if(CONN){c.close();return}CONN=c;c.on('data',onMsg);c.on('close',pvLost)})}
function pvJoin(){const d=pvDeck();if(!d)return;const code=$('#pvc').value.trim().toUpperCase();if(!code)return pvS('กรอกรหัสห้องก่อน');pvOff();pvS('กำลังเชื่อมต่อ...');
PEER=new Peer();PEER.on('error',e=>pvS('ผิดพลาด: '+e.type));
PEER.on('open',()=>{CONN=PEER.connect('kakrn-'+code,{reliable:true});CONN.on('open',()=>{pvS('เชื่อมต่อแล้ว รอเริ่มเกม...');net({t:'hello',deck:d})});CONN.on('data',onMsg);CONN.on('close',pvLost)})}
function onMsg(m){
if(m.t=='hello'){const seed=Math.random()*2147483647|0,first=Math.random()<.5?0:1,decks=[HD,m.deck];net({t:'init',seed,first,me:1,decks});initPvP({seed,first,me:0,decks})}
else if(m.t=='init')initPvP(m);
else if(m.t=='ans'){AW?(AW(m.v),AW=null):AQ.push(m.v)}
else if(m.t=='mull'){MULL[1-ME]=m.idx;tryStart()}
else if(m.t=='clk'){const ai=1-ME;RQ=RQ.then(async()=>{while(G&&!G.over&&(G.turn!=ai||G.ending))await sleep(50);if(G&&!G.over)await act(m.a,m.i,m.r,m.v,ai)}).catch(console.error)}}
function initPvP(m){RNGF=mb32(m.seed);UID=0;PVP=1;ME=m.me;BOT[0]=BOT[1]=false;SS=[null,null];AQ=[];AW=null;MULL=[null,null];const D=m.decks;
G={p:[newP(D[0].cards,D[0].lid,0),newP(D[1].cards,D[1].lid,1)],turn:0,field:null,ph:0,first:m.first,slot:0};
[0,1].forEach(j=>{G.p[j].sv=D[j].sv;G.p[j].mt=D[j].mat});log=[];mul=new Set();busy=false;lock=false;
draw(G.p[0],LD[D[0].lid].hd);draw(G.p[1],LD[D[1].lid].hd);show('app');$('#ov').style.display='none';render();ctrM();mulUI()}
function mullDone(ix){MULL[ME]=ix;net({t:'mull',idx:ix});tryStart()}
function tryStart(){if(!G||!PVP)return;if(!MULL[0]||!MULL[1]){if(MULL[ME])$('#ov').innerHTML='<h2>รอคู่ต่อสู้เลือก Mulligan...</h2>';return}
[0,1].forEach(j=>{const p=G.p[j],x=MULL[j];if(x.length){const out=x.map(k=>p.hand[k]);p.hand=p.hand.filter((_,k)=>!x.includes(k));p.deck.push(...out);shuf(p.deck);draw(p,out.length)}});
$('#ov').style.display='none';G.turn=G.first;start(G.first);render()}
menuR();
</script></body></html>
